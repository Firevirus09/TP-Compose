<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Compteur Compose</title>
    <style>
      :root {
        color-scheme: light dark;
        --fond: #f5f7fa;
        --carte: #ffffff;
        --texte: #1c2733;
        --discret: #566575;
        --bordure: #d8dfe6;
        --accent: #0b6bcb;
        --sur-accent: #ffffff;
        --erreur: #b3261e;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fond: #11181f;
          --carte: #1a232c;
          --texte: #e6ebf0;
          --discret: #9fadba;
          --bordure: #2e3a46;
          --accent: #5aa9f0;
          --sur-accent: #0b1a28;
          --erreur: #f2968f;
        }
      }

      body {
        margin: 0;
        background: var(--fond);
        color: var(--texte);
      }

      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 16px;
      }

      h1 {
        margin: 0 0 8px;
      }

      p {
        margin: 0 0 24px;
        color: var(--discret);
      }

      section {
        padding: 24px;
        text-align: center;
        background: var(--carte);
        border: 1px solid var(--bordure);
        border-radius: 8px;
      }

      output {
        display: block;
        margin-bottom: 16px;
        font-size: 4rem;
        font-weight: 700;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }

      button {
        padding: 10px 20px;
        font: inherit;
        font-weight: 600;
        color: var(--sur-accent);
        background: var(--accent);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }

      #erreur {
        margin: 16px 0 0;
        color: var(--erreur);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Compteur Compose</h1>
      <p>Le navigateur appelle l'API, qui lit et enregistre la valeur dans PostgreSQL.</p>
      <section>
        <output id="valeur" aria-live="polite">…</output>
        <button id="ajouter" type="button">Ajouter 1</button>
        <p id="erreur" role="alert" hidden></p>
      </section>
    </main>

    <script>
      const valeur = document.getElementById('valeur')
      const erreur = document.getElementById('erreur')

      async function appeler(methode) {
        try {
          const reponse = await fetch('/api/compteur', { method: methode })
          if (!reponse.ok) throw new Error(`HTTP ${reponse.status}`)
          const donnees = await reponse.json()
          valeur.textContent = donnees.valeur
          erreur.hidden = true
        } catch {
          erreur.textContent = "L'API ne répond pas."
          erreur.hidden = false
        }
      }

      document.getElementById('ajouter').addEventListener('click', () => appeler('POST'))
      appeler('GET')
    </script>
  </body>
</html>
